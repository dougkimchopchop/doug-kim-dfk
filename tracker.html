<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Daily</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,400;1,8..60,300&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2A2622;--ink-soft:#5B5142;--ink-muted:#8A7F72;
  --paper:#EFE6D3;--card:#F6EFDD;
  --oak:#6B4A2F;--oak-soft:#B79A78;--brass:#9C7A32;--ribbon:#7A2E2E;
  --line:rgba(42,38,34,0.16);--line-d:rgba(42,38,34,0.28);
  --pass:#2D6A4F;--pass-bg:#EAF4EE;
  --warn:#7A5C00;--warn-bg:#FBF5DC;
  --fail:#7A2E2E;--fail-bg:#F7EDED;
  --radius:3px;
  --display:'Fraunces',serif;--body:'Source Serif 4',Georgia,serif;--mono:'Space Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh}
a{color:inherit;text-decoration:none}

.page{max-width:640px;margin:0 auto;padding:2rem 1.5rem 5rem}

/* Breadcrumb */
.breadcrumb{font-family:var(--mono);font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-muted);display:flex;align-items:center;gap:.5rem;margin-bottom:1.8rem}
.breadcrumb a{color:var(--ink-muted)}
.breadcrumb a:hover{color:var(--ribbon)}
.breadcrumb-sep{color:var(--line-d)}

/* Header */
.eyebrow{font-family:var(--mono);font-size:.65rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ribbon);margin-bottom:.5rem;display:flex;align-items:center;gap:.4rem}
.eyebrow::before{content:"";width:.4rem;height:.4rem;border-radius:50%;background:var(--ribbon);display:inline-block}
h1{font-family:var(--display);font-weight:600;font-size:clamp(1.8rem,4vw,2.4rem);line-height:1.05;margin:0 0 .3rem}
.hdr-sub{font-family:var(--mono);font-size:.68rem;color:var(--ink-soft);margin:0 0 .3rem}
.hdr-date{font-family:var(--mono);font-size:.62rem;color:var(--oak-soft);margin:0 0 1rem}

/* 60 countdown */
.countdown-60{display:flex;align-items:baseline;gap:.5rem;margin:0 0 1.2rem;font-family:var(--mono);font-size:.65rem;color:var(--ink-soft);letter-spacing:.04em}
.countdown-60 .cd-num{font-family:var(--display);font-weight:700;font-size:1.5rem;color:var(--fail);line-height:1}

/* Sync */
.sync-bar{display:flex;align-items:center;gap:.6rem;margin-bottom:1.2rem;padding:.4rem .8rem;background:var(--card);border:1px solid var(--line);border-radius:var(--radius)}
.sync-dot{width:6px;height:6px;border-radius:50%;background:var(--line-d);flex-shrink:0;transition:background .3s}
.sync-dot.ok{background:var(--pass)}
.sync-dot.saving{background:var(--warn)}
.sync-dot.err{background:var(--fail)}
.sync-text{font-family:var(--mono);font-size:.62rem;color:var(--ink-soft);flex:1}

/* Tabs */
.tabs{display:flex;gap:0;border-bottom:1px solid var(--line-d);margin-bottom:1.6rem}
.tab{font-family:var(--mono);font-size:.65rem;letter-spacing:.08em;text-transform:uppercase;padding:.6rem 1.2rem;cursor:pointer;color:var(--ink-muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.active{color:var(--ribbon);border-color:var(--ribbon)}
.tab:hover{color:var(--ink)}
.panel{display:none}.panel.active{display:block}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border:1px solid var(--line-d);margin-bottom:1.6rem}
.sc{padding:.8rem .9rem;border-right:1px solid var(--line)}
.sc:last-child{border-right:none}
.sc-lbl{font-family:var(--mono);font-size:.58rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-muted);margin-bottom:.3rem}
.sc-num{font-family:var(--display);font-size:1.6rem;font-weight:600;color:var(--ink);line-height:1}
.sc-sub{font-family:var(--mono);font-size:.58rem;color:var(--ink-muted);margin-top:.2rem}
.sc-phase{font-family:var(--mono);font-size:.68rem;font-weight:700;color:var(--ink)}

/* Day nav */
.div{border:none;border-top:1px solid var(--line);margin:1.2rem 0}
.nav{display:flex;align-items:center;gap:.6rem;margin-bottom:1rem}
.nav button{background:transparent;border:1px solid var(--line);border-radius:var(--radius);padding:.3rem .8rem;font-family:var(--mono);font-size:.75rem;cursor:pointer;color:var(--ink)}
.nav button:hover{background:var(--ink);color:var(--paper)}
.nav-lbl{font-family:var(--mono);font-size:.65rem;flex:1;text-align:center;color:var(--ink-soft);letter-spacing:.06em;text-transform:uppercase}

/* Section label */
.sec-lbl{font-family:var(--mono);font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;color:var(--oak-soft);border-bottom:1px solid var(--line);padding-bottom:.4rem;margin-bottom:.9rem}

/* Habit grid */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line-d);margin-bottom:1.2rem}
.hc{background:var(--card);padding:.9rem .5rem;cursor:pointer;user-select:none;text-align:center;display:flex;flex-direction:column;align-items:center;gap:.4rem}
.grid .hc:last-child:nth-child(3n+1){grid-column:2}
.hc:hover{background:var(--paper)}
.hc.done{background:var(--pass-bg)}
.hc.missed{background:var(--fail-bg)}
.hc.half{background:var(--warn-bg)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--line-d);flex-shrink:0}
.hc.done .dot{background:var(--pass)}
.hc.missed .dot{background:var(--fail)}
.hc.half .dot{background:var(--warn)}
.hc-name{font-family:var(--mono);font-size:.6rem;color:var(--ink-muted);line-height:1.2}
.hc.done .hc-name{color:var(--pass)}
.hc.missed .hc-name{color:var(--fail)}
.hc.half .hc-name{color:var(--warn)}

/* Number inputs (Write/Read) */
.num-inputs{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin-bottom:1.2rem}
.num-inputs3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.6rem;margin-bottom:1.2rem}
.num-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:.9rem 1rem}
.num-card-title{font-family:var(--mono);font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;color:var(--oak-soft);margin-bottom:.6rem;display:flex;justify-content:space-between;align-items:center}
.num-card-target{color:var(--ink-muted);font-size:.58rem}
.num-input-row{display:flex;align-items:center;gap:.6rem}
.num-input-row input[type=number]{background:var(--paper);border:1px solid var(--line-d);border-radius:var(--radius);padding:.4rem .5rem;color:var(--ink);font-family:var(--display);font-size:1.3rem;width:70px;text-align:center;-moz-appearance:textfield}
.num-input-row input[type=number]::-webkit-inner-spin-button,
.num-input-row input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none}
.num-input-row input[type=number]:focus{outline:none;border-color:var(--ribbon)}
.num-unit{font-family:var(--mono);font-size:.65rem;color:var(--ink-muted)}
.num-pass{font-family:var(--mono);font-size:.58rem;margin-top:.4rem}
.num-pass.pass{color:var(--pass)}
.num-pass.warn{color:var(--warn)}

/* Ship 3 */
.ship3-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:1rem;margin-bottom:1.2rem}
.ship3-title{font-family:var(--mono);font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;color:var(--oak-soft);margin-bottom:.8rem}
.ship3-item{display:flex;align-items:center;gap:.7rem;margin-bottom:.6rem}
.ship3-item:last-child{margin-bottom:0}
.ship3-check{width:18px;height:18px;border:1px solid var(--line-d);border-radius:2px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:var(--paper)}
.ship3-check.done{background:var(--pass-bg);border-color:var(--pass)}
.ship3-check.done::after{content:"✓";font-size:.7rem;color:var(--pass);font-weight:700}
.ship3-input{flex:1;font-family:var(--body);font-size:.88rem;padding:.3rem .5rem;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);color:var(--ink)}
.ship3-input:focus{outline:none;border-color:var(--brass)}
.ship3-input.done-text{text-decoration:line-through;color:var(--ink-muted)}

/* Score */
.score-row{display:flex;align-items:baseline;gap:.8rem;margin-bottom:.3rem}
.score-big{font-family:var(--display);font-size:2.6rem;font-weight:600;color:var(--ink);line-height:1}
.score-sub{font-family:var(--mono);font-size:.65rem;color:var(--ink-muted)}
.score-sub .thresh{color:var(--ribbon)}
.verdict{font-family:var(--mono);font-size:.68rem;min-height:1rem;color:var(--ink-muted);margin-bottom:1.2rem}
.verdict.pass{color:var(--pass)}
.verdict.warn{color:var(--warn)}
.verdict.fail{color:var(--fail);font-weight:700}

/* Streak */
.sbar{display:flex;gap:2px;flex-wrap:wrap;margin-bottom:1.2rem}
.sd{width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:8px;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink-muted);border-radius:2px}
.sd.lp{background:var(--pass-bg);border-color:var(--pass);color:var(--pass)}
.sd.lw{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
.sd.lf{background:var(--fail-bg);border-color:var(--fail);color:var(--fail)}
.sd.today{border-color:var(--ribbon);color:var(--ink);font-weight:700}

/* Phases */
.phases{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:1px solid var(--line-d);margin-bottom:1.2rem}
.ph{padding:.7rem .8rem;border-right:1px solid var(--line);background:var(--card)}
.ph:last-child{border-right:none}
.ph.active{background:var(--fail-bg)}
.ph-name{font-family:var(--mono);font-size:.58rem;color:var(--ink-muted);margin-bottom:.2rem}
.ph.active .ph-name{color:var(--ribbon);font-weight:700}
.ph-dates{font-family:var(--mono);font-size:.55rem;color:var(--oak-soft)}
.ph.active .ph-dates{color:var(--ribbon);opacity:.7}

/* Bottom buttons */
.bot-row{display:flex;gap:.5rem;margin-top:.8rem}
.tbtn{font-family:var(--mono);font-size:.62rem;padding:.4rem .9rem;border:1px solid var(--line-d);background:transparent;color:var(--ink-muted);cursor:pointer;flex:1;text-align:center;border-radius:var(--radius)}
.tbtn:hover{background:var(--ink);color:var(--paper)}

/* ── WEEKLY PANEL ── */
.wk-topbar{background:var(--card);border:1px solid var(--line-d);border-radius:var(--radius);padding:1rem;margin-bottom:1rem}
.wk-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:.8rem}
.wk-nav button{background:transparent;border:1px solid var(--line);border-radius:var(--radius);padding:.25rem .7rem;font-family:var(--mono);font-size:.7rem;cursor:pointer;color:var(--ink-soft)}
.wk-nav button:hover{background:var(--ink);color:var(--paper)}
.wk-range{font-family:var(--mono);font-size:.65rem;color:var(--ink-soft);letter-spacing:.04em}

/* Weekly targets grid */
.wk-targets{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin-bottom:1rem}
.wk-target{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:.8rem .9rem}
.wk-target-name{font-family:var(--mono);font-size:.6rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-muted);margin-bottom:.5rem;display:flex;justify-content:space-between;align-items:center}
.wk-target-goal{color:var(--brass);font-size:.58rem}
.wk-target-input-row{display:flex;align-items:center;gap:.5rem}
.wk-target-input-row input[type=number]{background:var(--paper);border:1px solid var(--line-d);border-radius:var(--radius);padding:.3rem .5rem;color:var(--ink);font-family:var(--display);font-size:1.1rem;width:60px;text-align:center;-moz-appearance:textfield}
.wk-target-input-row input[type=number]::-webkit-inner-spin-button,
.wk-target-input-row input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none}
.wk-target-input-row input[type=number]:focus{outline:none;border-color:var(--ribbon)}
.wk-target-unit{font-family:var(--mono);font-size:.6rem;color:var(--ink-muted)}
.wk-bar{margin-top:.5rem;background:var(--line);height:3px;border-radius:1px;overflow:hidden}
.wk-bar-fill{height:3px;border-radius:1px;transition:width .3s}
.wk-target-status{font-family:var(--mono);font-size:.58rem;margin-top:.3rem}
.wk-target-status.pass{color:var(--pass)}
.wk-target-status.fail{color:var(--fail)}

/* Weekly shipped */
.shipped-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:.9rem 1rem;margin-bottom:1rem}
.shipped-title{font-family:var(--mono);font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;color:var(--oak-soft);margin-bottom:.8rem}
.shipped-item{margin-bottom:.6rem}
.shipped-label{font-family:var(--mono);font-size:.6rem;color:var(--ink-muted);margin-bottom:.3rem;letter-spacing:.06em;text-transform:uppercase}
textarea.shipped-input{width:100%;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);color:var(--ink);font-family:var(--body);font-size:.85rem;padding:.4rem .6rem;resize:none;min-height:44px;line-height:1.4}
textarea.shipped-input:focus{outline:none;border-color:var(--brass)}

/* Wins */
.wins-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:.9rem 1rem;margin-bottom:1rem}
.wins-title{font-family:var(--mono);font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;color:var(--oak-soft);margin-bottom:.7rem}
.win-row{display:flex;align-items:center;gap:.6rem;margin-bottom:.5rem}
.win-row:last-child{margin-bottom:0}
.win-num{font-family:var(--mono);font-size:.62rem;color:var(--ink-muted);width:14px;flex-shrink:0}
input.win-input{width:100%;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);color:var(--ink);font-family:var(--body);font-size:.88rem;padding:.35rem .6rem}
input.win-input:focus{outline:none;border-color:var(--brass)}

/* Consequences */
.consequence-card{border-radius:var(--radius);padding:.9rem 1rem;margin-bottom:1rem}
.consequence-card.habit-lock{background:var(--fail-bg);border:1px solid var(--ribbon)}
.consequence-card.output-lock{background:var(--warn-bg);border:1px solid var(--warn)}
.consequence-title{font-family:var(--mono);font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;margin-bottom:.3rem}
.habit-lock .consequence-title{color:var(--fail)}
.output-lock .consequence-title{color:var(--warn)}
.consequence-desc{font-size:.82rem;color:var(--ink-soft);margin-bottom:.6rem}
input.consequence-input{width:100%;background:var(--paper);border:1px solid var(--line-d);border-radius:var(--radius);color:var(--ink);font-family:var(--body);font-size:.88rem;padding:.4rem .6rem;margin-bottom:.6rem}
input.consequence-input:focus{outline:none;border-color:var(--ribbon)}
.lock-btn{width:100%;padding:.6rem;border-radius:var(--radius);font-family:var(--mono);font-size:.7rem;font-weight:700;cursor:pointer;letter-spacing:.08em}
.habit-lock .lock-btn{background:var(--fail-bg);border:1px solid var(--ribbon);color:var(--fail)}
.habit-lock .lock-btn:hover{background:var(--fail);color:var(--paper)}
.habit-lock .lock-btn.locked{background:var(--pass-bg);border-color:var(--pass);color:var(--pass)}
.output-lock .lock-btn{background:var(--warn-bg);border:1px solid var(--warn);color:var(--warn)}
.output-lock .lock-btn:hover{background:var(--warn);color:var(--paper)}
.output-lock .lock-btn.locked{background:var(--pass-bg);border-color:var(--pass);color:var(--pass)}
.lock-status{font-family:var(--mono);font-size:.58rem;color:var(--ink-muted);text-align:center;margin-top:.4rem}

/* Footer */
footer{border-top:1px solid var(--line);padding:1.2rem 0 0;font-family:var(--mono);font-size:.65rem;color:var(--ink-muted);display:flex;justify-content:space-between;flex-wrap:wrap;gap:.4rem;margin-top:2rem}
footer a{color:var(--ink-muted)}
footer a:hover{color:var(--ribbon)}

.setup-goal-row{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem}
.setup-goal-row input{flex:1;font-family:var(--body);font-size:.85rem;padding:.3rem .5rem;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);color:var(--ink)}
.setup-goal-row input:focus{outline:none;border-color:var(--brass)}
.setup-goal-row button{font-family:var(--mono);font-size:.7rem;padding:.3rem .5rem;border:1px solid var(--line);background:transparent;color:var(--fail);cursor:pointer;border-radius:var(--radius)}
@media(max-width:500px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .grid{grid-template-columns:repeat(2,1fr)}
  .wk-targets{grid-template-columns:1fr}
  .num-inputs{grid-template-columns:1fr}
  .num-inputs3{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
  <link rel="apple-touch-icon" href="/icons/icon-tracker.png">
</head>
<body>
<div class="page">

<nav class="breadcrumb" aria-label="Breadcrumb">
  <a href="https://doug-kim-dfk.vercel.app" target="_blank" rel="noopener">Doug Kim</a>
  <span class="breadcrumb-sep">/</span>
  <span>Daily</span>
</nav>

<div class="eyebrow">Daily</div>
<h1>Daily</h1>
<p class="hdr-sub" id="hdr-sub">Nothing logged. That's still a choice.</p>
<p class="hdr-date" id="hdr-date"></p>
<p class="countdown-60"><span class="cd-num" id="cd60-num">—</span><span>days til</span><span class="cd-num">60</span></p>

<div class="sync-bar">
  <div class="sync-dot" id="sync-dot"></div>
  <span class="sync-text" id="sync-text">Connecting…</span>
</div>

<!-- ═══ DAILY ═══ -->
<div class="panel active" id="panel-daily">

<div class="stats">
  <div class="sc"><div class="sc-lbl">Score</div><div class="sc-num" id="sc-score">0%</div><div class="sc-sub" id="sc-frac">0 / 5</div></div>
  <div class="sc"><div class="sc-lbl">Streak</div><div class="sc-num" id="sc-streak">0</div><div class="sc-sub">days won</div></div>
  <div class="sc"><div class="sc-lbl">Day</div><div class="sc-num" id="sc-day">—</div><div class="sc-sub">of 90</div></div>
  <div class="sc"><div class="sc-lbl">Phase</div><div class="sc-phase" id="sc-phase">—</div><div class="sc-sub" id="sc-pdays"></div></div>
</div>

<div class="div"></div>

<div class="nav">
  <button onclick="cd(-1)">←</button>
  <span class="nav-lbl" id="nav-lbl">Day 1 of 90</span>
  <button onclick="cd(1)">→</button>
</div>

<div class="sec-lbl">Habits — tap to log</div>
<div class="grid" id="grid"></div>

<div class="sec-lbl">Weight — logged every morning</div>
<div class="num-card" style="margin-bottom:1.2rem;">
  <div class="num-card-title">Weight <span class="num-card-target" id="weight-note"></span></div>
  <div class="num-input-row">
    <input type="number" id="weight-input" min="0" max="500" step="0.1" placeholder="0">
    <span class="num-unit">lbs</span>
  </div>
  <div class="num-pass" id="weight-trend"></div>
  <svg id="weight-chart" width="100%" height="60" style="margin-top:.6rem;display:block;"></svg>
</div>

<div class="score-row">
  <div class="score-big" id="sbig">0%</div>
  <div class="score-sub">Threshold: <span class="thresh">75%</span></div>
</div>
<div class="verdict" id="verdict"></div>

<div class="div"></div>
<div class="sec-lbl" id="sbar-lbl">28-day window</div>
<div class="sbar" id="sbar"></div>

<div class="sec-lbl">Phases</div>
<div class="phases" id="phases"></div>

<div class="bot-row">
  <button class="tbtn" onclick="markAll(true)">Mark all done</button>
  <button class="tbtn" onclick="markAll(false)">Clear all</button>
</div>

</div><!-- end daily -->

<footer>
  <span><a href="https://doug-kim-dfk.vercel.app" target="_blank" rel="noopener">← Doug Kim</a></span>
  <span id="last-updated">Daily · 2026</span>
</footer>

</div><!-- end page -->

<script>
const HABITS=[
  {id:'left_apartment', name:'Be outside'},
  {id:'exercise',  name:'Exercised'},
  {id:'social_irl',name:'Social physical'},
  {id:'wrote',     name:'Wrote'},
  {id:'shoot',     name:'Shoot'},
];

const TOTAL_CHECKS=HABITS.length;

const PHASES=[
  {name:'Phase 1 — Output',          dates:'Sep 7 – Oct 6', start:0, end:29,label:'Phase 1',days:'Days 1–30'},
  {name:'Phase 2 — Get paid',        dates:'Oct 7 – Nov 5',  start:30,end:59,label:'Phase 2',days:'Days 31–60'},
  {name:'Phase 3 — Raise everything',dates:'Nov 6 – Dec 5',  start:60,end:89,label:'Phase 3',days:'Days 61–90'},
];

const DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const START=new Date(2026,8,7);
const SUPABASE_URL='https://rpmxkhgirhlfwqefdopo.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJwbXhraGdpcmhsZndxZWZkb3BvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY2MDUzMTQsImV4cCI6MjA5MjE4MTMxNH0.bAUNydSiWh60mxD23RLYXpSpRxrzt0q2JQ7yDSZmOW4';
const LS_KEY='dfk_tracker';

let data={},cur=0,saveTimer=null;

function todayIdx(){return Math.max(0,Math.min(89,Math.floor((Date.now()-START.getTime())/86400000)))}
function dk(d){return 'd'+d}
function gd(d){return data[dk(d)]||{}}
function dayDate(d){const dt=new Date(START);dt.setDate(dt.getDate()+d);return dt}
function habitScore(d){
  const dd=gd(d);
  const hDone=HABITS.filter(h=>dd[h.id]===true).length;
  if(!HABITS.some(h=>dd[h.id]!==undefined))return -1;
  return Math.round(hDone/TOTAL_CHECKS*100);
}
function doneCount(d){
  const dd=gd(d);
  return HABITS.filter(h=>dd[h.id]===true).length;
}

function setSyncStatus(s,msg){document.getElementById('sync-dot').className='sync-dot'+(s?' '+s:'');document.getElementById('sync-text').textContent=msg;}

async function loadData(){
  // migrate old keys
  if(!localStorage.getItem(LS_KEY)){
    const old=localStorage.getItem('dfk_jul27')||localStorage.getItem('dfk_jul13')||localStorage.getItem('dfk_jul6');
    if(old)localStorage.setItem(LS_KEY,old);
  }
  try{
    const r=await fetch(SUPABASE_URL+'/rest/v1/dfk_tracker?select=data&order=id.desc&limit=1',{headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY}});
    if(r.ok){const rows=await r.json();if(rows&&rows.length>0&&rows[0].data)data=JSON.parse(rows[0].data);setSyncStatus('ok','Synced · '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}));}
    else throw new Error();
  }catch(e){const local=localStorage.getItem(LS_KEY);if(local){try{data=JSON.parse(local)}catch(ex){data={}}}setSyncStatus('err','Offline — local data');}
}

async function saveData(){
  setSyncStatus('saving','Saving…');
  try{
    // Merge in server-side fields this page doesn't manage (e.g. task_log,
    // written by The List app) so a save here doesn't clobber them with our
    // stale in-memory copy — the row is shared across tracker/grid/list.
    try{
      const rr=await fetch(SUPABASE_URL+'/rest/v1/dfk_tracker?select=data&id=eq.1',{headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY}});
      if(rr.ok){const rows=await rr.json();if(rows&&rows[0]&&rows[0].data){const remote=JSON.parse(rows[0].data);data={...remote,...data};}}
    }catch(e){/* best-effort merge; fall through to save local data as-is */}
    const payload=JSON.stringify(data);localStorage.setItem(LS_KEY,payload);
    const r=await fetch(SUPABASE_URL+'/rest/v1/dfk_tracker',{method:'POST',headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Content-Type':'application/json','Prefer':'resolution=merge-duplicates'},body:JSON.stringify({id:1,data:payload})});
    if(r.ok)setSyncStatus('ok','Synced · '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}));else throw new Error();
  }catch(e){setSyncStatus('err','Sync failed — saved locally');}
}
function scheduleSave(){clearTimeout(saveTimer);saveTimer=setTimeout(saveData,800)}

/* ── DAILY ── */
function renderGrid(){
  const dd=gd(cur);
  const habitsHtml=HABITS.map(h=>{
    const s=dd[h.id];const cls=s===true?'done':s===false?'missed':'';
    return `<div class="hc ${cls}" onclick="cyc('${h.id}')"><div class="dot"></div><div class="hc-name">${h.name}</div></div>`;
  }).join('');
  document.getElementById('grid').innerHTML=habitsHtml;
  updateScore();
}

function cyc(id){
  if(!data[dk(cur)])data[dk(cur)]={};
  const c=data[dk(cur)][id];
  if(c===undefined)data[dk(cur)][id]=true;else if(c===true)data[dk(cur)][id]=false;else delete data[dk(cur)][id];
  scheduleSave();renderGrid();renderStreak();updateHeader();updateStats();
}

function markAll(val){
  if(!data[dk(cur)])data[dk(cur)]={};
  HABITS.forEach(h=>{data[dk(cur)][h.id]=val});
  scheduleSave();renderGrid();renderStreak();updateHeader();updateStats();
}

document.getElementById('weight-input').addEventListener('input',function(){
  const v=parseFloat(this.value);
  if(!data[dk(cur)])data[dk(cur)]={};
  if(!isNaN(v)&&this.value!=='')data[dk(cur)].weight=v;else delete data[dk(cur)].weight;
  scheduleSave();renderWeightChart();
});

/* Weight — daily input + 7-day sparkline ending on the currently viewed day */
function renderWeightInput(){
  const dd=gd(cur);
  document.getElementById('weight-input').value=(dd.weight!==undefined)?dd.weight:'';
  renderWeightChart();
}

function renderWeightChart(){
  const start=Math.max(0,cur-6);
  const days=[];for(let i=start;i<=cur;i++)days.push(i);
  const series=days.map(d=>({d,v:gd(d).weight})).filter(p=>p.v!==undefined&&p.v!==null&&p.v!=='');
  const svg=document.getElementById('weight-chart');
  const trendEl=document.getElementById('weight-trend');
  if(series.length<2){
    svg.innerHTML='';
    trendEl.textContent=series.length===1?(series[0].v+' lbs logged — a few more mornings to see the trend'):'';
    trendEl.className='num-pass';
    return;
  }
  const w=300,h=60,pad=8;
  const vals=series.map(p=>p.v);
  const minV=Math.min(...vals),maxV=Math.max(...vals);
  const range=(maxV-minV)||1;
  const stepX=series.length>1?(w-2*pad)/(series.length-1):0;
  const coords=series.map((p,i)=>{
    const x=pad+i*stepX;
    const y=h-pad-((p.v-minV)/range)*(h-2*pad);
    return {x,y,today:p.d===cur};
  });
  const pointsAttr=coords.map(c=>c.x.toFixed(1)+','+c.y.toFixed(1)).join(' ');
  const dots=coords.map(c=>'<circle cx="'+c.x.toFixed(1)+'" cy="'+c.y.toFixed(1)+'" r="'+(c.today?3:2)+'" fill="'+(c.today?'#7A2E2E':'#9C7A32')+'"/>').join('');
  svg.setAttribute('viewBox','0 0 '+w+' '+h);
  svg.innerHTML='<polyline points="'+pointsAttr+'" fill="none" stroke="#9C7A32" stroke-width="1.5"/>'+dots;
  const first=series[0].v,last=series[series.length-1].v;
  const delta=last-first;
  const sign=delta>0?'+':'';
  trendEl.textContent=last.toFixed(1)+' lbs · '+sign+delta.toFixed(1)+' over '+series.length+' mornings';
  trendEl.className='num-pass '+(delta<0?'pass':delta>0?'warn':'');
}

function updateScore(){
  const s=habitScore(cur);const done=doneCount(cur);const max=TOTAL_CHECKS;
  document.getElementById('sbig').textContent=s<0?'0%':s+'%';
  document.getElementById('sc-score').textContent=s<0?'0%':s+'%';
  document.getElementById('sc-frac').textContent=done+' / '+max;
  const v=document.getElementById('verdict');
  if(s<0||s===0){v.className='verdict';v.textContent='';}
  else if(s===100){v.className='verdict pass';v.textContent='100% — every vote cast for DFK.';}
  else if(s>=75){v.className='verdict pass';v.textContent=s+'% — above threshold. DFK showed up.';}
  else if(s>=50){v.className='verdict warn';v.textContent=s+'% — below threshold. Not good enough.';}
  else{v.className='verdict fail';v.textContent=s+"% — Loss. The pattern is being written right now.";}
}

function updateHeader(){
  const s=habitScore(cur);const sub=document.getElementById('hdr-sub');
  if(s<0)sub.textContent="Nothing logged. That's still a choice.";
  else if(s===100)sub.textContent="Full score. Every vote cast for DFK.";
  else if(s>=75)sub.textContent="Above threshold. DFK showed up today.";
  else if(s>=50)sub.textContent="Below threshold. Not good enough.";
  else sub.textContent="Loss. The pattern is being written right now.";
}

function updateStats(){
  const today=todayIdx();let streak=0;
  for(let i=today;i>=0;i--){if(habitScore(i)>=75)streak++;else break}
  document.getElementById('sc-streak').textContent=streak;
  document.getElementById('sc-day').textContent=today+1;
  const ph=PHASES.find(p=>cur>=p.start&&cur<=p.end)||PHASES[0];
  document.getElementById('sc-phase').textContent=ph.label;
  document.getElementById('sc-pdays').textContent=ph.days;
}

function cd(d){cur=Math.max(0,Math.min(todayIdx(),cur+d));updateNav();renderGrid();renderWeightInput();renderStreak();renderPhases();updateHeader();}

function updateNav(){
  document.getElementById('nav-lbl').textContent='Day '+(cur+1)+' of 90 · '+dayDate(cur).toLocaleDateString('en-US',{month:'short',day:'numeric'});
}

function renderStreak(){
  const today=todayIdx();const start=Math.max(0,today-27);const days=[];for(let i=start;i<=today;i++)days.push(i);
  document.getElementById('sbar-lbl').textContent=days.length+'-day window';
  document.getElementById('sbar').innerHTML=days.map(i=>{
    const s=habitScore(i);const lbl=dayDate(i).getDate();
    let cls='sd';if(s>=75)cls+=' lp';else if(s>=50)cls+=' lw';else if(s>=0)cls+=' lf';
    if(i===today)cls+=' today';
    const outline=i===cur?'outline:1.5px solid var(--ribbon);outline-offset:1px':'';
    return `<div class="${cls}" onclick="jmp(${i})" title="Day ${i+1}: ${s>=0?s+'%':'—'}" style="${outline}">${lbl}</div>`;
  }).join('');
}

function renderPhases(){
  document.getElementById('phases').innerHTML=PHASES.map(p=>`<div class="ph${cur>=p.start&&cur<=p.end?' active':''}"><div class="ph-name">${p.name}</div><div class="ph-dates">${p.dates}</div></div>`).join('');
}

function jmp(d){if(d<=todayIdx()){cur=d;updateNav();renderGrid();renderWeightInput();renderStreak();renderPhases();updateHeader();}}

/* Init */
document.getElementById('hdr-date').textContent=new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});

const TURNS_60=new Date(2027,5,19);
document.getElementById('cd60-num').textContent=Math.ceil((TURNS_60-new Date())/86400000);

async function init(){
  await loadData();cur=todayIdx();
  updateNav();renderGrid();renderWeightInput();renderStreak();renderPhases();updateHeader();updateStats();
  document.getElementById('last-updated').textContent='Synced '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
}
init();

// Mobile Safari (and other browsers) can restore this page from the
// back-forward cache when you switch apps/tabs and return, without
// re-running any JS — you'd see whatever was on screen at the moment you
// left, not fresh data. Force a real reload from Supabase whenever the
// page becomes visible again so desktop/mobile never drift.
window.addEventListener('pageshow',function(e){if(e.persisted)init();});
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')init();});
</script>
