<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>DFK — Grid</title>
<link rel="stylesheet" href="styles.css">
<style>
.breadcrumb{font-family:var(--mono);font-size:.65rem;color:var(--ink-soft);margin-bottom:1.4rem;display:flex;align-items:center;gap:.4rem}
.breadcrumb a{color:var(--ink-soft);text-decoration:none}
.breadcrumb a:hover{color:var(--ribbon)}
.breadcrumb-sep{color:var(--oak-soft)}

.grid-page{max-width:100%;padding:3rem 1.5rem 5rem;}
.grid-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:var(--radius);background:var(--card);padding:.8rem;}
table.heat{border-collapse:collapse;min-width:max-content}
.heat th{font-family:var(--mono);font-size:9px;font-weight:600;color:var(--oak-soft);text-align:center;padding:2px 0;border:none;position:sticky;top:0;background:var(--card);z-index:2}
.heat th.habit-head{text-align:left;padding-left:6px;position:sticky;left:0;background:var(--card);z-index:3;width:96px;font-size:9px;color:var(--ink-soft);letter-spacing:.06em;text-transform:uppercase}
.heat td.habit-name{font-family:var(--body);font-size:11px;color:var(--ink);white-space:nowrap;padding:1px 6px 1px 0;position:sticky;left:0;background:var(--card);z-index:1;width:96px;min-width:96px;line-height:1.4}
.heat td.cell{width:16px;min-width:16px;height:16px;cursor:pointer;border:0.5px solid var(--line);background:var(--paper);text-align:center;vertical-align:middle;transition:background .1s}
.heat td.cell:hover{background:var(--line-d)}
.heat td.cell.done{background:var(--pass);border-color:var(--pass)}
.heat td.cell.missed{background:var(--fail);border-color:var(--fail)}
.heat td.cell.future{background:rgba(107,74,47,0.08);border-color:var(--line);cursor:default}
.heat td.cell.today{border-color:var(--ribbon) !important;border-width:1.5px}
.heat td.cell.week-sep{border-left:1px solid var(--oak-soft)}
.heat .day-num{font-family:var(--mono);font-size:8px;color:var(--oak-soft);line-height:1}
.heat .day-num.today-num{color:var(--ribbon);font-weight:700}
.heat .day-num.sun{color:var(--ink-soft)}
/* Hours cells */
.heat td.cell.hrs-low{background:#FBF5DC;border-color:var(--warn)}
.heat td.cell.hrs-pass{background:#EAF4EE;border-color:var(--pass)}
.heat td.cell.hrs-full{background:var(--pass);border-color:var(--pass)}
.heat td.cell.hrs-text{font-family:var(--mono);font-size:7px;color:var(--ink);cursor:default}
/* Week separator row */
.heat tr.week-summary td{background:var(--paper);border-top:1.5px solid var(--oak-soft);padding:3px 2px;vertical-align:top}
.heat tr.week-summary td.wk-label{font-family:var(--mono);font-size:8px;color:var(--oak-soft);padding-left:4px;white-space:nowrap;position:sticky;left:0;background:var(--paper);z-index:1}
.heat tr.week-summary td.wk-data{font-family:var(--mono);font-size:7px;color:var(--ink-soft);text-align:center;white-space:nowrap}
.heat tr.week-summary td.wk-hit{color:var(--pass)}
.heat tr.week-summary td.wk-miss{color:var(--fail)}
.heat-legend{display:flex;gap:14px;margin-top:.9rem;flex-wrap:wrap}
.heat-leg{display:flex;align-items:center;gap:5px;font-family:var(--mono);font-size:.65rem;color:var(--ink-soft)}
.heat-leg-box{width:11px;height:11px;border-radius:2px;flex-shrink:0;border:0.5px solid var(--line)}

/* Weekly summaries below grid */
.wk-summaries{margin-top:2rem}
.wk-summary-block{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:1rem 1.1rem;margin-bottom:.8rem}
.wk-summary-header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:.8rem}
.wk-summary-title{font-family:var(--mono);font-size:.65rem;font-weight:700;color:var(--ink);letter-spacing:.06em;text-transform:uppercase}
.wk-summary-score{font-family:var(--mono);font-size:.62rem;color:var(--ink-muted)}
.wk-summary-section{margin-bottom:.7rem}
.wk-summary-section:last-child{margin-bottom:0}
.wk-summary-sec-lbl{font-family:var(--mono);font-size:.58rem;letter-spacing:.1em;text-transform:uppercase;color:var(--oak-soft);margin-bottom:.3rem}
.wk-targets-row{display:flex;flex-wrap:wrap;gap:.4rem}
.wk-target-chip{font-family:var(--mono);font-size:.6rem;padding:2px 7px;border-radius:20px;border:1px solid}
.wk-target-chip.hit{background:var(--pass-bg);color:var(--pass);border-color:var(--pass)}
.wk-target-chip.miss{background:var(--fail-bg);color:var(--fail);border-color:var(--fail)}
.wk-target-chip.empty{background:var(--paper);color:var(--ink-muted);border-color:var(--line)}
.wk-shipped-item{font-size:.85rem;color:var(--ink-soft);margin-bottom:.3rem;padding-left:.5rem;border-left:2px solid var(--line-d)}
.wk-shipped-label{font-family:var(--mono);font-size:.58rem;color:var(--oak-soft);margin-bottom:.1rem}
.wk-wins-list{font-size:.85rem;color:var(--ink-soft)}
.wk-wins-list li{margin-bottom:.2rem;list-style:none;padding-left:.8rem;position:relative}
.wk-wins-list li::before{content:"✓";position:absolute;left:0;color:var(--pass);font-size:.7rem}
.wk-empty{font-family:var(--mono);font-size:.65rem;color:var(--line-d);font-style:italic}
</style>
<link rel="apple-touch-icon" href="/icons/icon-grid.png">
</head>
<body>
<div class="page grid-page">

<nav class="breadcrumb" aria-label="Breadcrumb">
  <a href="https://doug-kim-dfk.vercel.app" target="_blank" rel="noopener">Doug Kim</a>
  <span class="breadcrumb-sep">/</span>
  <span>Grid</span>
</nav>
<span class="eyebrow">Daily</span>
<h1 style="font-family:var(--display);font-weight:600;font-size:clamp(1.6rem,3.5vw,2.2rem);line-height:1.05;margin:0 0 .3rem;">Grid</h1>
<p style="font-family:var(--mono);font-size:.68rem;color:var(--ink-soft);margin:0 0 1rem;">90-day heatmap — every habit, every day. Tap a cell to log it.</p>

<div class="sync-bar">
  <div class="sync-dot" id="sync-dot"></div>
  <span class="sync-text" id="sync-text">Connecting…</span>
</div>

<div class="grid-wrap">
  <table class="heat" id="grid-table">
    <thead id="grid-head"></thead>
    <tbody id="grid-body"></tbody>
  </table>
</div>

<div class="heat-legend">
  <div class="heat-leg"><span class="heat-leg-box" style="background:var(--pass);border-color:var(--pass)"></span>Done</div>
  <div class="heat-leg"><span class="heat-leg-box" style="background:var(--fail);border-color:var(--fail)"></span>Missed</div>
  <div class="heat-leg"><span class="heat-leg-box" style="background:#EAF4EE;border-color:var(--pass)"></span>Metric pass (Write/Read/Deep Work/Outside/Screen Time)</div>
  <div class="heat-leg"><span class="heat-leg-box" style="background:#FBF5DC;border-color:var(--warn)"></span>Metric partial / Meditate 1-of-2</div>
  <div class="heat-leg"><span class="heat-leg-box" style="background:var(--paper)"></span>Not logged</div>
  <div class="heat-leg"><span class="heat-leg-box" style="background:rgba(107,74,47,0.08)"></span>Future</div>
</div>

<div class="wk-summaries" id="wk-summaries"></div>

</div>

<footer>
  <span><a href="https://doug-kim-dfk.vercel.app" target="_blank" rel="noopener" style="color:inherit;">← Doug Kim</a></span>
  <span id="last-updated">Grid · synced to tracker data</span>
</footer>

<script>
const HABITS=[
  'Be Outside','Strength','Run','Social Physical','Write','Shoot',
];
const HABIT_IDS=[
  'left_apartment','exercise','run','social_irl','wrote','shoot',
];
// Special rows rendered differently
const WRITE_ID='write_hrs'; const READ_ID='read_hrs';
const WRITE_PASS=2; const READ_PASS=1; const WRITE_FULL=4;
const DEEPWORK_PASS=4; const SCREEN_PASS=1; const OUTSIDE_PASS=2;

const WK_TARGETS=[
  {id:'pushups',   name:'Push-ups', goal:700},
  {id:'rolls',     name:'Rolls',    goal:5},
  {id:'sub_post',  name:'Thu essay', goal:1},
  {id:'sub_notes', name:'Notes',    goal:5},
  {id:'sub_restack',name:'Restacks',goal:20},
  {id:'ig_posts',  name:'IG posts', goal:3},
];

const DEFAULT_GOALS=['Istanbul Essay','PM Outreach','Photos to Editors','Songbook'];

const DAYS_SHORT=['S','M','T','W','T','F','S'];
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const START=new Date(2026,8,7);
const LS_KEY='dfk_tracker';
const SUPABASE_URL='https://rpmxkhgirhlfwqefdopo.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJwbXhraGdpcmhsZndxZWZkb3BvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY2MDUzMTQsImV4cCI6MjA5MjE4MTMxNH0.bAUNydSiWh60mxD23RLYXpSpRxrzt0q2JQ7yDSZmOW4';

let data={};
let saveTimer=null;

function dk(d){return 'd'+d}
function dayDate(d){const dt=new Date(START);dt.setDate(dt.getDate()+d);return dt}
function todayIdx(){return Math.max(0,Math.min(89,Math.round((new Date()-START)/86400000)))}
function getDay(d){return data[dk(d)]||{}}
function weekKey(sunDayIdx){const dt=dayDate(Math.max(0,sunDayIdx));const sun=new Date(dt);sun.setDate(dt.getDate()-dt.getDay());return 'w'+sun.toISOString().slice(0,10)}

function setSyncStatus(state,text){
  document.getElementById('sync-dot').className='sync-dot '+state;
  document.getElementById('sync-text').textContent=text;
}

async function loadData(){
  try{
    const r=await fetch(SUPABASE_URL+'/rest/v1/dfk_tracker?select=data&order=id.desc&limit=1',{
      headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY}
    });
    if(r.ok){
      const rows=await r.json();
      if(rows&&rows.length>0&&rows[0].data) data=JSON.parse(rows[0].data);
      setSyncStatus('ok','Synced · '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}));
    } else throw new Error();
  } catch(e){
    const local=localStorage.getItem(LS_KEY);
    if(local){try{data=JSON.parse(local)}catch(ex){data={}}}
    setSyncStatus('err','Offline — local data');
  }
}

async function saveData(){
  setSyncStatus('saving','Saving…');
  try{
    // Merge in server-side fields this page doesn't manage (e.g. task_log,
    // written by The List app) so a save here doesn't clobber them with our
    // stale in-memory copy — the row is shared across tracker/grid/list.
    try{
      const rr=await fetch(SUPABASE_URL+'/rest/v1/dfk_tracker?select=data&id=eq.1',{headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY}});
      if(rr.ok){const rows=await rr.json();if(rows&&rows[0]&&rows[0].data){const remote=JSON.parse(rows[0].data);data={...remote,...data};}}
    }catch(e){/* best-effort merge; fall through to save local data as-is */}
    const payload=JSON.stringify(data);
    localStorage.setItem(LS_KEY,payload);
    const r=await fetch(SUPABASE_URL+'/rest/v1/dfk_tracker',{
      method:'POST',
      headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Content-Type':'application/json','Prefer':'resolution=merge-duplicates'},
      body:JSON.stringify({id:1,data:payload})
    });
    if(r.ok) setSyncStatus('ok','Synced · '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}));
    else throw new Error();
  } catch(e){ setSyncStatus('err','Sync failed — saved locally'); }
}

function scheduleSave(){clearTimeout(saveTimer);saveTimer=setTimeout(saveData,800)}

function buildGrid(){
  const today=todayIdx();
  const head=document.getElementById('grid-head');
  const body=document.getElementById('grid-body');

  let monthRow='<tr><th class="habit-head">Habit</th>';
  let dayRow='<tr><th class="habit-head"></th>';
  let numRow='<tr><th class="habit-head"></th>';
  let lastMonth=-1,monthSpan=0,monthCells=[];

  for(let d=0;d<90;d++){
    const dt=dayDate(d);const dow=dt.getDay();const mon=dt.getMonth();
    const isWeekSep=dow===0&&d>0;const cls=(isWeekSep?'week-sep ':'')+'day-col';
    if(mon!==lastMonth){if(lastMonth!==-1)monthCells.push({month:lastMonth,span:monthSpan});lastMonth=mon;monthSpan=0;}
    monthSpan++;if(d===89)monthCells.push({month:mon,span:monthSpan});
    const isToday=d===today;
    dayRow+=`<th class="${cls}" style="${isToday?'color:var(--ribbon)':''}">${DAYS_SHORT[dow]}</th>`;
    numRow+=`<th class="${cls}"><span class="day-num${isToday?' today-num':''}${dow===0?' sun':''}">${dt.getDate()}</span></th>`;
  }
  monthCells.forEach(mc=>{
    monthRow+=`<th colspan="${mc.span}" style="text-align:left;font-size:9px;color:var(--oak-soft);padding-left:3px;letter-spacing:.06em;text-transform:uppercase;font-weight:600">${MONTHS[mc.month]}</th>`;
  });
  head.innerHTML=monthRow+'</tr>'+dayRow+'</tr>'+numRow+'</tr>';

  let bodyHTML='';

  // Meditate row (tri-state: 0 none, 1 half, 2 full)
  bodyHTML+=`<tr><td class="habit-name">Meditate</td>`;
  for(let d=0;d<90;d++){
    const dt=dayDate(d);const dow=dt.getDay();
    const isFuture=d>today;const isToday=d===today;const isWeekSep=dow===0&&d>0;
    const st=getDay(d).meditate||0;
    let cls='cell';
    if(isFuture)cls+=' future';
    else if(st===2)cls+=' done';
    else if(st===1)cls+=' hrs-low';
    if(isToday)cls+=' today';if(isWeekSep)cls+=' week-sep';
    const clickFn=isFuture?'':'onclick="cycleMeditateCell('+d+')"';
    bodyHTML+=`<td class="${cls}" data-row="meditate" data-d="${d}" ${clickFn}></td>`;
  }
  bodyHTML+='</tr>';

  // Habit rows
  HABITS.forEach((habit,hi)=>{
    const hid=HABIT_IDS[hi];
    bodyHTML+=`<tr class="habit-row" data-hi="${hi}"><td class="habit-name">${habit}</td>`;
    for(let d=0;d<90;d++){
      const dt=dayDate(d);const dow=dt.getDay();
      const isFuture=d>today;const isToday=d===today;const isWeekSep=dow===0&&d>0;
      const dd=getDay(d);const state=dd[hid];
      let cls='cell';
      if(isFuture)cls+=' future';
      else if(state===true)cls+=' done';
      else if(state===false)cls+=' missed';
      if(isToday)cls+=' today';if(isWeekSep)cls+=' week-sep';
      const clickFn=isFuture?'':'onclick="cycleCell('+hi+','+d+')"';
      bodyHTML+=`<td class="${cls}" data-hi="${hi}" data-d="${d}" ${clickFn}></td>`;
    }
    bodyHTML+='</tr>';
  });

  // Write row
  bodyHTML+=`<tr><td class="habit-name" style="color:var(--brass)">Write (hrs)</td>`;
  for(let d=0;d<90;d++){
    const dt=dayDate(d);const dow=dt.getDay();
    const isFuture=d>today;const isToday=d===today;const isWeekSep=dow===0&&d>0;
    const hrs=getDay(d)[WRITE_ID]||0;
    let cls='cell hrs-text';
    if(isFuture)cls='cell future';
    else if(hrs>=WRITE_FULL)cls='cell hrs-full';
    else if(hrs>=WRITE_PASS)cls='cell hrs-pass';
    else if(hrs>0)cls='cell hrs-low';
    if(isToday)cls+=' today';if(isWeekSep)cls+=' week-sep';
    bodyHTML+=`<td class="${cls}" data-d="${d}">${(!isFuture&&hrs>0)?hrs:''}</td>`;
  }
  bodyHTML+='</tr>';

  // Read row
  bodyHTML+=`<tr><td class="habit-name" style="color:var(--brass)">Read (hrs)</td>`;
  for(let d=0;d<90;d++){
    const dt=dayDate(d);const dow=dt.getDay();
    const isFuture=d>today;const isToday=d===today;const isWeekSep=dow===0&&d>0;
    const hrs=getDay(d)[READ_ID]||0;
    let cls='cell hrs-text';
    if(isFuture)cls='cell future';
    else if(hrs>=READ_PASS)cls='cell hrs-pass';
    else if(hrs>0)cls='cell hrs-low';
    if(isToday)cls+=' today';if(isWeekSep)cls+=' week-sep';
    bodyHTML+=`<td class="${cls}" data-d="${d}">${(!isFuture&&hrs>0)?hrs:''}</td>`;
  }
  bodyHTML+='</tr>';

  // Deep Work row
  bodyHTML+=`<tr><td class="habit-name" style="color:var(--brass)">Deep Work (blocks)</td>`;
  for(let d=0;d<90;d++){
    const dt=dayDate(d);const dow=dt.getDay();
    const isFuture=d>today;const isToday=d===today;const isWeekSep=dow===0&&d>0;
    const v=getDay(d).deepwork_blocks||0;
    let cls='cell hrs-text';
    if(isFuture)cls='cell future';
    else if(v>=DEEPWORK_PASS)cls='cell hrs-full';
    else if(v>0)cls='cell hrs-low';
    if(isToday)cls+=' today';if(isWeekSep)cls+=' week-sep';
    bodyHTML+=`<td class="${cls}" data-d="${d}">${(!isFuture&&v>0)?v:''}</td>`;
  }
  bodyHTML+='</tr>';

  // Screen Time row (inverted — lower is better)
  bodyHTML+=`<tr><td class="habit-name" style="color:var(--brass)">Screen Time (hrs)</td>`;
  for(let d=0;d<90;d++){
    const dt=dayDate(d);const dow=dt.getDay();
    const isFuture=d>today;const isToday=d===today;const isWeekSep=dow===0&&d>0;
    const v=getDay(d).screen_time_hrs;
    let cls='cell hrs-text';
    if(isFuture)cls='cell future';
    else if(v===undefined)cls='cell';
    else if(v<=SCREEN_PASS)cls='cell hrs-full';
    else cls='cell hrs-low';
    if(isToday)cls+=' today';if(isWeekSep)cls+=' week-sep';
    bodyHTML+=`<td class="${cls}" data-d="${d}">${(!isFuture&&v!==undefined)?v:''}</td>`;
  }
  bodyHTML+='</tr>';

  // Outside row
  bodyHTML+=`<tr><td class="habit-name" style="color:var(--brass)">Outside (hrs)</td>`;
  for(let d=0;d<90;d++){
    const dt=dayDate(d);const dow=dt.getDay();
    const isFuture=d>today;const isToday=d===today;const isWeekSep=dow===0&&d>0;
    const v=getDay(d).outside_blocks||0;
    let cls='cell hrs-text';
    if(isFuture)cls='cell future';
    else if(v>=OUTSIDE_PASS)cls='cell hrs-full';
    else if(v>0)cls='cell hrs-low';
    if(isToday)cls+=' today';if(isWeekSep)cls+=' week-sep';
    bodyHTML+=`<td class="${cls}" data-d="${d}">${(!isFuture&&v>0)?v:''}</td>`;
  }
  bodyHTML+='</tr>';

  body.innerHTML=bodyHTML;
}

function cycleMeditateCell(d){
  if(!data[dk(d)])data[dk(d)]={};
  const c=data[dk(d)].meditate||0;
  const next=(c+1)%3;
  if(next===0)delete data[dk(d)].meditate;else data[dk(d)].meditate=next;
  updateMeditateCell(d);
  scheduleSave();
}

function updateMeditateCell(d){
  const today=todayIdx();
  const td=document.querySelector(`td.cell[data-row="meditate"][data-d="${d}"]`);
  if(!td)return;
  const st=getDay(d).meditate||0;const isToday=d===today;const dow=dayDate(d).getDay();
  let cls='cell';
  if(st===2)cls+=' done';else if(st===1)cls+=' hrs-low';
  if(isToday)cls+=' today';if(dow===0&&d>0)cls+=' week-sep';
  td.className=cls;
}

function cycleCell(hi,d){
  const hid=HABIT_IDS[hi];
  if(!data[dk(d)])data[dk(d)]={};
  const cur=data[dk(d)][hid];
  if(cur===undefined)data[dk(d)][hid]=true;
  else if(cur===true)data[dk(d)][hid]=false;
  else delete data[dk(d)][hid];
  updateCell(hi,d);
  scheduleSave();
}

function updateCell(hi,d){
  const today=todayIdx();const hid=HABIT_IDS[hi];
  const td=document.querySelector(`td.cell[data-hi="${hi}"][data-d="${d}"]`);
  if(!td)return;
  const state=getDay(d)[hid];const isToday=d===today;const dow=dayDate(d).getDay();
  let cls='cell';
  if(state===true)cls+=' done';else if(state===false)cls+=' missed';
  if(isToday)cls+=' today';if(dow===0&&d>0)cls+=' week-sep';
  td.className=cls;
}

function buildWeeklySummaries(){
  const today=todayIdx();
  const goals=data.ship_goals||DEFAULT_GOALS;
  const container=document.getElementById('wk-summaries');
  if(!container)return;

  // Find all weeks that have started
  let weeks=[];
  for(let d=0;d<90;d+=7){
    if(d>today+7)break;
    weeks.push(d);
  }

  if(weeks.length===0){container.innerHTML='';return;}

  let html='<div class="sec-lbl" style="margin-bottom:.8rem">Weekly Archive</div>';

  weeks.forEach(startD=>{
    const endD=Math.min(startD+6,90);
    const dt0=dayDate(startD);const dt1=dayDate(endD);
    const wk=weekKey(startD);const wd=data[wk]||{};
    const label=dt0.toLocaleDateString('en-US',{month:'short',day:'numeric'})+' – '+dt1.toLocaleDateString('en-US',{month:'short',day:'numeric'});
    const weekNum=Math.floor(startD/7)+1;

    // DFK days this week
    let dfkDays=0;let loggedDays=0;
    for(let d=startD;d<=Math.min(endD,today);d++){
      loggedDays++;
      const dd=getDay(d);
      const hDone=HABITS.filter((_,hi)=>dd[HABIT_IDS[hi]]===true).length;
      const medDone=dd.meditate||0;
      const wDone=(dd[WRITE_ID]||0)>=WRITE_PASS?1:0;
      const rDone=(dd[READ_ID]||0)>=READ_PASS?1:0;
      const dwDone=(dd.deepwork_blocks||0)>=DEEPWORK_PASS?1:0;
      const stDone=(dd.screen_time_hrs!==undefined&&dd.screen_time_hrs<=SCREEN_PASS)?1:0;
      const outDone=(dd.outside_blocks||0)>=OUTSIDE_PASS?1:0;
      const total=hDone+medDone+wDone+rDone+dwDone+stDone+outDone;
      const max=HABITS.length+2/*meditate*/+2/*write+read*/+1+1+1;
      if(total/max>=0.75)dfkDays++;
    }
    const dfkPct=loggedDays>0?Math.round(dfkDays/loggedDays*100):0;

    // Target chips
    const targetChips=WK_TARGETS.map(t=>{
      const val=wd['target_'+t.id]||0;const hit=val>=t.goal;
      const cls=val===0?'empty':hit?'hit':'miss';
      return `<span class="wk-target-chip ${cls}">${t.name} ${val}/${t.goal}</span>`;
    }).join('');

    // Shipped items
    let shippedHTML='';
    goals.forEach((g,i)=>{
      const v=wd['shipped_goal_'+i];
      if(v)shippedHTML+=`<div class="wk-shipped-item"><div class="wk-shipped-label">${g}</div>${v}</div>`;
    });

    // Wins
    const wins=[wd.win1,wd.win2,wd.win3].filter(Boolean);
    const winsHTML=wins.length?`<ul class="wk-wins-list">${wins.map(w=>`<li>${w}</li>`).join('')}</ul>`:'';

    const isFuture=startD>today;
    const opacity=isFuture?'opacity:.4':'';

    html+=`<div class="wk-summary-block" style="${opacity}">
      <div class="wk-summary-header">
        <div class="wk-summary-title">Week ${weekNum} · ${label}</div>
        <div class="wk-summary-score">${loggedDays>0?dfkDays+'/'+loggedDays+' DFK days ('+dfkPct+'%)':'not started'}</div>
      </div>
      <div class="wk-summary-section">
        <div class="wk-summary-sec-lbl">Weekly targets</div>
        <div class="wk-targets-row">${targetChips||'<span class="wk-empty">nothing logged</span>'}</div>
      </div>
      ${shippedHTML?`<div class="wk-summary-section"><div class="wk-summary-sec-lbl">Shipped</div>${shippedHTML}</div>`:''}
      ${winsHTML?`<div class="wk-summary-section"><div class="wk-summary-sec-lbl">Big wins</div>${winsHTML}</div>`:''}
    </div>`;
  });

  container.innerHTML=html;
}

async function init(){
  await loadData();
  buildGrid();
  buildWeeklySummaries();
  document.getElementById('last-updated').textContent='Synced '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
}
init();

// Force a fresh Supabase fetch when the page is restored from bfcache
// (mobile app-switch/tab-switch) instead of showing stale rendered data.
window.addEventListener('pageshow',function(e){if(e.persisted)init();});
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')init();});
</script>
