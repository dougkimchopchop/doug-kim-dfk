<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="The List">
<title>The List — Doug Kim</title>
<link rel="apple-touch-icon" href="/icons/icon-daily-list.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink:#2A2622; --ink-soft:#5B5142;
    --paper:#EFE6D3; --card:#F6EFDD;
    --oak:#6B4A2F; --oak-soft:#B79A78;
    --brass:#9C7A32; --ribbon:#7A2E2E;
    --bright-red:#C93A3A;
    --line: rgba(42,38,34,0.16); --line-d: rgba(42,38,34,0.28);
    --radius: 3px;
    --accent: var(--ribbon);
  }
  .divider {
    font-family: 'Fraunces', serif; font-weight: 600;
    font-size: 19px; letter-spacing: .01em; color: var(--ink);
    margin: 40px 0 6px; padding-top: 24px; border-top: 1px solid var(--oak-soft);
  }
  section:first-of-type .divider { margin-top: 18px; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: 'Source Serif 4', serif;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 40px 20px 56px; }
  .crumb {
    font-family: 'Space Mono', monospace; font-size: 12px; letter-spacing: .03em;
    color: var(--ink-soft); margin-bottom: 28px;
  }
  .crumb a { color: var(--ink-soft); text-decoration: none; border-bottom: 1px solid var(--line-d); }
  .crumb a:hover { color: var(--ribbon); border-color: var(--ribbon); }
  header { margin-bottom: 6px; }
  h1 {
    font-family: 'Fraunces', serif; font-weight: 600;
    font-size: 22px; letter-spacing: .01em; margin: 0; color: var(--ink);
  }
  .stamp { font-family: 'Space Mono', monospace; color: var(--ink-soft); font-size: 12px; margin-top: 5px; letter-spacing: .03em; }
  #status { font-family: 'Space Mono', monospace; color: var(--ink-soft); font-size: 12px; min-height: 15px; margin: 10px 0 0; }
  section { margin-top: 28px; }
  section:first-of-type { margin-top: 18px; }
  .sec-head { display: flex; align-items: center; gap: 9px; margin-bottom: 12px; padding-bottom: 9px; border-bottom: 1px solid var(--oak-soft); }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  h2 {
    font-family: 'Space Mono', monospace; font-size: 12px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .08em; margin: 0; color: var(--ink-soft);
  }
  ul { list-style: none; margin: 0; padding: 0; }
  li { display: flex; align-items: flex-start; gap: 12px; padding: 7px 0; font-size: 16px; line-height: 1.5; }
  li a { color: var(--ribbon); }
  .chk {
    appearance: none; -webkit-appearance: none;
    width: 19px; height: 19px; margin-top: 2px; flex: none;
    border: 2px solid var(--oak-soft); border-radius: 50%;
    cursor: pointer; position: relative; transition: all .15s; background: var(--card);
  }
  .chk:checked { background: var(--accent); border-color: var(--accent); }
  .chk:checked::after {
    content: ""; position: absolute; left: 5px; top: 1px;
    width: 5px; height: 10px; border: solid var(--card); border-width: 0 2px 2px 0; transform: rotate(45deg);
  }
  li.doing { opacity: .4; text-decoration: line-through; }
  li.dragging { opacity: .35; }
  .txt { flex: 1; cursor: text; border-radius: 2px; }
  .txt:hover { background: rgba(42,38,34,0.05); }
  .txt.urgent { color: var(--bright-red); }
  .edit-input {
    flex: 1; background: var(--card); border: 1px solid var(--brass); border-radius: 2px;
    color: var(--ink); font-size: 16px; font-family: 'Source Serif 4', serif;
    padding: 2px 6px; margin: -2px 0; outline: none;
  }
  .drag-handle {
    flex: none; width: 16px; margin-top: 2px; cursor: grab; color: var(--ink-soft);
    opacity: .45; font-size: 14px; line-height: 1; text-align: center; user-select: none;
    touch-action: none; /* stop iOS from scrolling the page instead of starting the drag */
  }
  .drag-handle:hover { opacity: .9; }
  .drag-handle:active { cursor: grabbing; }
  ul.drag-over { outline: 1.5px dashed var(--brass); outline-offset: 4px; border-radius: var(--radius); }
  .drag-ghost {
    position: fixed; top: 0; left: 0; z-index: 9999; pointer-events: none;
    opacity: .92; background: var(--card); box-shadow: 0 6px 18px rgba(42,38,34,.28);
    border-radius: var(--radius); list-style: none;
  }
  .add-row { display: flex; align-items: center; gap: 12px; padding: 7px 0; }
  .add-btn {
    width: 19px; height: 19px; flex: none; border-radius: 50%;
    border: 1.5px dashed var(--oak-soft); background: none; color: var(--ink-soft);
    font-size: 13px; line-height: 1; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .add-btn:active { color: var(--ribbon); border-color: var(--ribbon); }
  .add-row input {
    flex: 1; background: none; border: none; outline: none;
    color: var(--ink); font-size: 16px; font-family: 'Source Serif 4', serif; padding: 2px 0;
  }
  .add-row input::placeholder { color: var(--ink-soft); opacity: .7; }
  footer {
    margin-top: 56px; padding-top: 18px; border-top: 1px solid var(--line);
    font-family: 'Space Mono', monospace; font-size: 12px; color: var(--ink-soft);
    display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px;
  }
  footer a { color: var(--ink-soft); text-decoration: none; border-bottom: 1px solid var(--line-d); }
  footer a:hover { color: var(--ribbon); border-color: var(--ribbon); }

  .counter {
    display: flex; align-items: center; gap: 18px; margin-top: 18px;
    padding: 12px 16px; background: var(--card); border: 1px solid var(--line);
    border-radius: var(--radius);
  }
  .counter-today { display: flex; flex-direction: column; }
  .counter-num {
    font-family: 'Fraunces', serif; font-weight: 600; font-size: 26px; color: var(--ink); line-height: 1;
  }
  .counter-lbl {
    font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: .08em;
    text-transform: uppercase; color: var(--ink-soft); margin-top: 3px;
  }
  .counter-hist {
    display: flex; gap: 8px; flex-wrap: wrap; flex: 1;
    font-family: 'Space Mono', monospace; font-size: 11px; color: var(--ink-soft);
  }
  .counter-hist span.day { color: var(--ink); font-weight: 700; }
</style>
</head>
<body>
<div class="wrap">
  <div class="crumb"><a href="https://doug-kim-dfk.vercel.app">Doug Kim</a> / The List</div>
  <header>
    <h1>The List</h1>
    <div class="stamp" id="stamp"></div>
  </header>
  <div id="status">Loading…</div>

  <div class="counter" id="counter" style="display:none">
    <div class="counter-today">
      <div class="counter-num" id="counter-today-num">0</div>
      <div class="counter-lbl">Tasks completed today</div>
    </div>
    <div class="counter-today" style="border-left:1px solid var(--line);padding-left:18px;">
      <div class="counter-num" id="counter-major-num">0</div>
      <div class="counter-lbl">Major DFK today</div>
    </div>
    <div class="counter-hist" id="counter-hist"></div>
  </div>

  <div id="sections"></div>

  <footer>
    <a href="https://doug-kim-dfk.vercel.app">← Doug Kim</a>
    <span>The List · 2026</span>
  </footer>
</div>

<script>
// Any dot color from the site's palette, cycled per section in the order
// they appear on the Notion page — not tied to fixed section names.
const DOT_COLORS = ['#7A2E2E', '#9C7A32', '#6B4A2F', '#5B5142', '#B79A78'];
const statusEl = document.getElementById('status');
const sectionsEl = document.getElementById('sections');

let appKey = localStorage.getItem('dlkey') || '';
function headers() {
  const h = { 'Content-Type': 'application/json' };
  if (appKey) h['x-app-key'] = appKey;
  return h;
}
async function ensureKeyThen(fn) {
  try { return await fn(); }
  catch (e) {
    if (String(e.message).includes('401')) {
      const k = prompt('Enter your list passcode:');
      if (k) { appKey = k; localStorage.setItem('dlkey', k); return fn(); }
    }
    throw e;
  }
}

function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function linkify(s){ return esc(s).replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>'); }

const MONTHS = { Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11 };
// Matches a trailing "— Mon D" (optionally followed by more text like "— deadline").
// Returns a Date for the current year, or null if no date-like suffix is found.
function extractDueDate(text) {
  const m = text.match(/[—-]\s*([A-Z][a-z]{2})\s+(\d{1,2})(?:\D|$)/);
  if (!m || !(m[1] in MONTHS)) return null;
  const now = new Date();
  return new Date(now.getFullYear(), MONTHS[m[1]], parseInt(m[2], 10));
}
function isDueSoon(text) {
  const due = extractDueDate(text);
  if (!due) return false;
  const today = new Date();
  today.setHours(0,0,0,0);
  const diffDays = Math.round((due - today) / 86400000);
  return diffDays <= 7; // overdue or due within the next 7 days
}

function setStamp() {
  const d = new Date();
  document.getElementById('stamp').textContent =
    d.toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' });
}

async function api(path, opts) {
  const res = await fetch(path, opts);
  if (!res.ok) throw new Error(res.status + '');
  return res.json();
}

function render(data) {
  const sections = data.sections || [];
  sectionsEl.innerHTML = '';
  let cycleIndex = 0;
  sections.forEach((sec) => {
    const section = document.createElement('section');
    const isPhase = /^phase\b/i.test(sec.label);
    const color = isPhase ? 'var(--bright-red)' : DOT_COLORS[cycleIndex++ % DOT_COLORS.length];
    const dividerHtml = sec.divider ? '<div class="divider">' + esc(sec.divider) + '</div>' : '';
    section.innerHTML =
      dividerHtml +
      '<div class="sec-head"><span class="dot" style="background:' + color + '"></span><h2>' + esc(sec.label) + '</h2></div>' +
      '<ul data-key="' + sec.key + '"></ul>';
    sectionsEl.appendChild(section);

    const ul = section.querySelector('ul');
    const isMajor = !!sec.divider;
    sec.items.forEach((it) => {
      const li = document.createElement('li');
      li.dataset.id = it.id;
      const urgent = isDueSoon(it.text);
      li.innerHTML =
        '<span class="drag-handle" title="Drag to move">⠿</span>' +
        '<input type="checkbox" class="chk">' +
        '<span class="txt' + (urgent ? ' urgent' : '') + '">' + linkify(it.text) + '</span>';
      li.querySelector('.chk').addEventListener('change', () => complete(li, it, isMajor));
      li.querySelector('.txt').addEventListener('click', (e) => {
        if (e.target.tagName === 'A') return; // let links navigate, don't start editing
        startEdit(li, it, urgent);
      });
      wireDrag(li, it, sec);
      ul.appendChild(li);
    });

    const addLi = document.createElement('li');
    addLi.className = 'add-row';
    addLi.innerHTML = '<button class="add-btn">+</button><input placeholder="Add to ' + esc(sec.label) + '…">';
    const input = addLi.querySelector('input');
    const btn = addLi.querySelector('.add-btn');
    const go = () => addItem(sec.key, input);
    btn.addEventListener('click', go);
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') go(); });
    ul.appendChild(addLi);
  });
}

/* ── Inline edit ── */
function startEdit(li, it, urgent) {
  if (li.querySelector('.edit-input')) return; // already editing
  const span = li.querySelector('.txt');
  const input = document.createElement('input');
  input.className = 'edit-input';
  input.value = it.text;
  li.replaceChild(input, span);
  input.focus();
  input.setSelectionRange(input.value.length, input.value.length);

  let done = false;
  const finish = (save) => {
    if (done) return;
    done = true;
    if (save) saveEdit(li, it, urgent, input.value.trim());
    else restoreSpan(li, it, urgent);
  };
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); finish(true); }
    else if (e.key === 'Escape') { e.preventDefault(); finish(false); }
  });
  input.addEventListener('blur', () => finish(true));
}

function restoreSpan(li, it, urgent) {
  const input = li.querySelector('.edit-input');
  if (!input) return;
  const span = document.createElement('span');
  span.className = 'txt' + (urgent ? ' urgent' : '');
  span.innerHTML = linkify(it.text);
  li.replaceChild(span, input);
  span.addEventListener('click', (e) => {
    if (e.target.tagName === 'A') return;
    startEdit(li, it, urgent);
  });
}

function updateSpanContent(li, it, urgent) {
  const span = li.querySelector('.txt');
  if (!span) return;
  span.className = 'txt' + (urgent ? ' urgent' : '');
  span.innerHTML = linkify(it.text);
}

async function saveEdit(li, it, urgent, newText) {
  if (!newText || newText === it.text) { restoreSpan(li, it, urgent); return; }
  const prev = it.text;
  it.text = newText; // optimistic
  restoreSpan(li, it, isDueSoon(newText));
  try {
    await ensureKeyThen(() => api('/api/edit', { method: 'POST', headers: headers(), body: JSON.stringify({ id: it.id, text: newText, type: it.type }) }));
  } catch (e) {
    it.text = prev;
    updateSpanContent(li, it, urgent); // input is already gone at this point — update the span in place, not restoreSpan
    statusEl.textContent = 'Could not save edit: ' + e.message;
  }
}

/* ── Drag and drop ──
   Uses Pointer Events (not the HTML5 drag-and-drop API) because this app
   runs as an iPhone home-screen web app, and native HTML5 DnD does not fire
   on touch in Safari. Pointer Events cover mouse + touch + pen uniformly.

   Two behaviors share this one gesture:
   - Within the item's own section: the li is live-repositioned in the DOM
     as it's dragged over siblings, then persisted via /api/reorder on drop.
   - Dragged into a different section's list: unchanged from before — just
     highlights that list and appends the item there on drop (server-side
     always at the end; the item's own section list is unaffected). */
function wireDrag(li, it, sec) {
  const handle = li.querySelector('.drag-handle');
  handle.addEventListener('pointerdown', (e) => startDrag(e, li, it, sec));
}

function siblingItemId(el) {
  return el && el.tagName === 'LI' && !el.classList.contains('add-row') ? el.dataset.id : null;
}

// Live-reposition `li` inside `ul` (its own section's list) to match where
// the pointer currently is, without ever moving it past the trailing add-row.
function positionInList(ul, li, clientY) {
  const addRow = ul.querySelector('.add-row');
  const items = Array.from(ul.children).filter((el) => el !== li && el.tagName === 'LI' && !el.classList.contains('add-row'));
  let ref = null; // insert before this element; null = insert at the end (before add-row)
  for (const item of items) {
    const r = item.getBoundingClientRect();
    if (clientY < r.top + r.height / 2) { ref = item; break; }
  }
  const target = ref || addRow || null;
  if (li.nextElementSibling !== target) ul.insertBefore(li, target);
}

function startDrag(e, li, it, sec) {
  e.preventDefault();
  const handle = e.currentTarget;
  try { handle.setPointerCapture(e.pointerId); } catch (_) {}

  const startX = e.clientX, startY = e.clientY;
  const rect = li.getBoundingClientRect();
  const offX = startX - rect.left, offY = startY - rect.top;
  const sourceUl = li.parentElement;
  const startAfterId = siblingItemId(li.previousElementSibling);
  let dragging = false, ghost = null, currentUl = null;

  function onMove(ev) {
    const dx = ev.clientX - startX, dy = ev.clientY - startY;
    if (!dragging) {
      if (Math.hypot(dx, dy) < 6) return; // ignore tiny jitter / simple taps
      dragging = true;
      li.classList.add('dragging');
      ghost = li.cloneNode(true);
      ghost.classList.add('drag-ghost');
      ghost.style.width = rect.width + 'px';
      document.body.appendChild(ghost);
    }
    ghost.style.left = (ev.clientX - offX) + 'px';
    ghost.style.top = (ev.clientY - offY) + 'px';
    const prevDisplay = ghost.style.display;
    ghost.style.display = 'none'; // don't let the ghost occlude elementFromPoint
    const elUnder = document.elementFromPoint(ev.clientX, ev.clientY);
    ghost.style.display = prevDisplay;
    const ul = elUnder && elUnder.closest && elUnder.closest('ul[data-key]');
    if (ul !== currentUl) {
      if (currentUl) currentUl.classList.remove('drag-over');
      currentUl = ul;
      if (currentUl) currentUl.classList.add('drag-over');
    }
    if (ul === sourceUl) positionInList(sourceUl, li, ev.clientY);
  }

  function cleanup() {
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUp);
    document.removeEventListener('pointercancel', cleanup);
    li.classList.remove('dragging');
    if (ghost) ghost.remove();
    if (currentUl) currentUl.classList.remove('drag-over');
  }

  function onUp() {
    const wasDragging = dragging;
    const toKey = currentUl && currentUl.dataset.key;
    cleanup();
    if (!wasDragging) return;
    if (!currentUl) return; // dropped outside any list — leave everything as-is
    if (toKey !== sec.key) {
      moveItem({ id: it.id, text: it.text, type: it.type }, toKey);
      return;
    }
    const finalAfterId = siblingItemId(li.previousElementSibling);
    if (finalAfterId !== startAfterId) {
      reorderItem(it, sec.key, finalAfterId);
    }
  }

  document.addEventListener('pointermove', onMove);
  document.addEventListener('pointerup', onUp);
  document.addEventListener('pointercancel', cleanup);
}

async function moveItem(payload, toKey) {
  statusEl.textContent = 'Moving…';
  try {
    await ensureKeyThen(() => api('/api/move', { method: 'POST', headers: headers(), body: JSON.stringify({ id: payload.id, text: payload.text, type: payload.type, toSection: toKey }) }));
    statusEl.textContent = '';
    load();
  } catch (e) {
    statusEl.textContent = 'Could not move: ' + e.message;
  }
}

async function reorderItem(it, sectionKey, afterId) {
  statusEl.textContent = 'Reordering…';
  try {
    await ensureKeyThen(() => api('/api/reorder', { method: 'POST', headers: headers(), body: JSON.stringify({ id: it.id, text: it.text, type: it.type, section: sectionKey, afterId: afterId || null }) }));
    statusEl.textContent = '';
    load();
  } catch (e) {
    statusEl.textContent = 'Could not reorder: ' + e.message;
    load(); // resync the list in case the drag left stale positions on screen
  }
}

async function load() {
  statusEl.textContent = 'Loading…';
  try {
    const data = await ensureKeyThen(() => api('/api/list', { headers: headers() }));
    render(data);
    statusEl.textContent = '';
  } catch (e) {
    statusEl.textContent = 'Error loading: ' + e.message;
  }
}

async function complete(li, it, isMajor) {
  li.classList.add('doing');
  try {
    await ensureKeyThen(() => api('/api/done', { method:'POST', headers: headers(), body: JSON.stringify({ id: it.id, type: it.type, text: it.text, major: !!isMajor }) }));
    li.remove();
    loadCounter();
  } catch (e) {
    li.classList.remove('doing');
    li.querySelector('.chk').checked = false;
    statusEl.textContent = 'Could not complete: ' + e.message;
  }
}

// Completed-per-day counter — reads the same Supabase row the habit tracker
// writes to (tracker.html), under a separate "task_log" key it doesn't touch.
const SUPABASE_URL = 'https://rpmxkhgirhlfwqefdopo.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJwbXhraGdpcmhsZndxZWZkb3BvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY2MDUzMTQsImV4cCI6MjA5MjE4MTMxNH0.bAUNydSiWh60mxD23RLYXpSpRxrzt0q2JQ7yDSZmOW4';

function fmtDay(iso) {
  const [y,m,d] = iso.split('-').map(Number);
  return new Date(y, m-1, d).toLocaleDateString('en-US', { month:'short', day:'numeric' });
}

async function loadCounter() {
  try {
    const r = await fetch(SUPABASE_URL + '/rest/v1/dfk_tracker?select=data&order=id.desc&limit=1', {
      headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY }
    });
    if (!r.ok) return;
    const rows = await r.json();
    let data = {};
    if (rows && rows[0] && rows[0].data) { try { data = JSON.parse(rows[0].data); } catch { data = {}; } }
    const log = data.task_log || {};
    const today = new Date().toISOString().slice(0,10);
    const todayEntry = log[today];
    const todayTotal = typeof todayEntry === 'number' ? todayEntry : (todayEntry && todayEntry.total) || 0;
    const todayMajor = (todayEntry && typeof todayEntry === 'object' && todayEntry.major) || 0;
    document.getElementById('counter-today-num').textContent = todayTotal;
    document.getElementById('counter-major-num').textContent = todayMajor;

    const days = Object.keys(log).sort().reverse().slice(0, 7).filter(d => d !== today);
    document.getElementById('counter-hist').innerHTML = days
      .map(d => {
        const e = log[d];
        const t = typeof e === 'number' ? e : (e && e.total) || 0;
        return fmtDay(d) + ' <span class="day">' + t + '</span>';
      })
      .join(' &nbsp;·&nbsp; ');
    document.getElementById('counter').style.display = 'flex';
  } catch (e) {
    // silent — counter is a nice-to-have, not critical
  }
}

async function addItem(sectionKey, input) {
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  try {
    await ensureKeyThen(() => api('/api/add', { method:'POST', headers: headers(), body: JSON.stringify({ section: sectionKey, text }) }));
    load();
  } catch (e) {
    input.value = text;
    statusEl.textContent = 'Could not add: ' + e.message;
  }
}

setStamp();
load();
loadCounter();
</script>
</body>
</html>
